<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>甘丹設計｜諮詢表單</title>
<style>body{font-family:sans-serif;text-align:center;padding:40px 16px;color:#555}a{color:#555}</style>
</head>
<body>
<p>正在前往甘丹設計諮詢表單…</p>
<p><a id="go" href="https://contact.gandandesign.com.tw/">若沒有自動跳轉，請點這裡</a></p>
<script>
(function () {
  // 部署 Apps Script Web App 後，把 /exec 網址貼在這裡
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzEKtgt4NUEiF1rcVwedJiyPJcTpbWu_ilqyp6haBLn8jBTvAcYT1NAZnyzem7kgguNJg/exec';
  var CONTACT = 'https://contact.gandandesign.com.tw/';
  var UTM = { yt: 'youtube', fb: 'facebook' };

  var c = new URLSearchParams(location.search).get('c') || '';
  var m = /^(v\d{3})-(yt|fb)$/.exec(c);      // 影片：v001-yt
  var isEntry = /^s\d{3}$/.test(c);            // 固定入口（FB 社團等）：s001
  var target = CONTACT;
  if (m) {
    target = CONTACT + '?gd_source=' + c + '&utm_source=' + UTM[m[2]] +
      '&utm_medium=organic&utm_campaign=' + m[1] + '&utm_content=' + c;
  } else if (isEntry) {
    target = CONTACT + '?gd_source=' + c + '&utm_source=entry&utm_medium=referral&utm_campaign=' + c +
      '&utm_content=' + c;
  }
  if (m || isEntry) {
    // 這台裝置的隨機碼：只用來讓後台把 30 分鐘內的重複點擊算成一次，不含任何個資
    var v = '';
    try {
      v = localStorage.getItem('gd_vid') || '';
      if (!/^[a-z0-9]{16}$/.test(v)) {
        v = Array.from(crypto.getRandomValues(new Uint8Array(8)), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
        localStorage.setItem('gd_vid', v);
      }
    } catch (e) { v = ''; }
    try {
      var data = JSON.stringify({ c: c, v: v });
      var sent = navigator.sendBeacon &&
        navigator.sendBeacon(ENDPOINT, new Blob([data], { type: 'text/plain' }));
      if (!sent) fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', keepalive: true, body: data });
    } catch (e) {}
  }
  document.getElementById('go').href = target;
  location.replace(target);
})();
</script>
</body>
</html>
